<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:34px;font-weight:700;fill:#222}
      .subtitle{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:18px;fill:#555}
      .label{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16px;fill:#333}
      .small{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13px;fill:#444}
      .tiny{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:12px;fill:#555}
      .conv{fill:#c9f5f7;stroke:#55dbe4;stroke-width:3}
      .bn{fill:#cbf3e7;stroke:#54d6bd;stroke-width:3}
      .relu{fill:#fff2bd;stroke:#f3c744;stroke-width:3}
      .flat{fill:#dfe4ff;stroke:#9aa7ff;stroke-width:3}
      .fc{fill:#ffe1ef;stroke:#f19ac5;stroke-width:3}
      .mask{fill:#e9e9e9;stroke:#bababa;stroke-width:2.5}
      .input{fill:#f6f6f6;stroke:#a9a9a9;stroke-width:2.5}
      .resbox{fill:none;stroke:#1f1f1f;stroke-width:2.5;stroke-dasharray:7 6}
      .arrow{stroke:#444;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .thinArrow{stroke:#555;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .skip{stroke:#777;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-dasharray:4 4}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" class="title">CNNModel v2 Neural Network Architecture</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">Input: observation [B,145,4,9] · Output: masked logits [B,235] · ResBlock ×16 · Policy Head</text>

  <!-- Main flow y=240 -->
  <rect x="55" y="205" width="130" height="82" rx="4" class="input"/>
  <text x="120" y="236" text-anchor="middle" class="label">Observation</text>
  <text x="120" y="260" text-anchor="middle" class="small">[B,145,4,9]</text>

  <line x1="185" y1="246" x2="220" y2="246" class="arrow"/>

  <rect x="220" y="195" width="105" height="102" rx="4" class="conv"/>
  <text x="272.5" y="232" text-anchor="middle" class="label">Conv2d</text>
  <text x="272.5" y="255" text-anchor="middle" class="small">3×3</text>
  <text x="272.5" y="276" text-anchor="middle" class="tiny">145→128</text>

  <line x1="325" y1="246" x2="345" y2="246" class="arrow"/>
  <rect x="345" y="203" width="58" height="86" rx="4" class="bn"/>
  <text x="374" y="251" text-anchor="middle" class="label">BN</text>

  <line x1="403" y1="246" x2="423" y2="246" class="arrow"/>
  <rect x="423" y="203" width="72" height="86" rx="4" class="relu"/>
  <text x="459" y="251" text-anchor="middle" class="label">ReLU</text>

  <line x1="495" y1="246" x2="545" y2="246" class="arrow"/>

  <!-- Residual blocks area -->
  <rect x="545" y="135" width="472" height="242" rx="14" class="resbox"/>
  <text x="781" y="163" text-anchor="middle" class="label" style="font-weight:700">Residual Block ×16</text>

  <rect x="590" y="205" width="94" height="82" rx="4" class="conv"/>
  <text x="637" y="235" text-anchor="middle" class="small">Conv2d</text>
  <text x="637" y="256" text-anchor="middle" class="tiny">3×3, 128→128</text>

  <line x1="684" y1="246" x2="703" y2="246" class="arrow"/>
  <rect x="703" y="211" width="52" height="70" rx="4" class="bn"/>
  <text x="729" y="251" text-anchor="middle" class="small">BN</text>

  <line x1="755" y1="246" x2="774" y2="246" class="arrow"/>
  <rect x="774" y="211" width="64" height="70" rx="4" class="relu"/>
  <text x="806" y="251" text-anchor="middle" class="small">ReLU</text>

  <line x1="838" y1="246" x2="858" y2="246" class="arrow"/>
  <rect x="858" y="205" width="94" height="82" rx="4" class="conv"/>
  <text x="905" y="235" text-anchor="middle" class="small">Conv2d</text>
  <text x="905" y="256" text-anchor="middle" class="tiny">3×3, 128→128</text>

  <line x1="952" y1="246" x2="970" y2="246" class="arrow"/>
  <rect x="970" y="211" width="52" height="70" rx="4" class="bn"/>
  <text x="996" y="251" text-anchor="middle" class="small">BN</text>

  <!-- skip connection -->
  <path d="M 585 246 C 585 330, 992 330, 992 288" class="skip"/>
  <circle cx="997" cy="246" r="15" fill="#ffffff" stroke="#777" stroke-width="2"/>
  <text x="997" y="251" text-anchor="middle" class="label">+</text>
  <line x1="1022" y1="246" x2="1045" y2="246" class="arrow"/>
  <rect x="1045" y="211" width="64" height="70" rx="4" class="relu"/>
  <text x="1077" y="251" text-anchor="middle" class="small">ReLU</text>
  <text x="781" y="352" text-anchor="middle" class="tiny">Each block keeps feature size [B,128,4,9] and adds identity shortcut</text>

  <!-- Continue flow -->
  <line x1="1017" y1="246" x2="1045" y2="246" class="arrow" opacity="0"/>
  <line x1="1017" y1="246" x2="1128" y2="246" class="arrow"/>

  <rect x="1128" y="195" width="94" height="102" rx="4" class="conv"/>
  <text x="1175" y="230" text-anchor="middle" class="label">Conv2d</text>
  <text x="1175" y="253" text-anchor="middle" class="small">1×1</text>
  <text x="1175" y="274" text-anchor="middle" class="tiny">128→32</text>

  <line x1="1222" y1="246" x2="1242" y2="246" class="arrow"/>
  <rect x="1242" y="203" width="58" height="86" rx="4" class="bn"/>
  <text x="1271" y="251" text-anchor="middle" class="label">BN</text>

  <line x1="1300" y1="246" x2="1320" y2="246" class="arrow"/>
  <rect x="1320" y="203" width="72" height="86" rx="4" class="relu"/>
  <text x="1356" y="251" text-anchor="middle" class="label">ReLU</text>

  <!-- Down to FC head -->
  <path d="M 1392 246 H 1435 V 425 H 190" class="arrow"/>
  <text x="820" y="416" text-anchor="middle" class="tiny">Policy Head</text>

  <rect x="190" y="472" width="96" height="86" rx="4" class="flat"/>
  <text x="238" y="504" text-anchor="middle" class="label">Flatten</text>
  <text x="238" y="528" text-anchor="middle" class="small">32×4×9</text>
  <text x="238" y="548" text-anchor="middle" class="tiny">=1152</text>

  <line x1="286" y1="515" x2="340" y2="515" class="arrow"/>
  <rect x="340" y="462" width="118" height="106" rx="4" class="fc"/>
  <text x="399" y="503" text-anchor="middle" class="label">Linear</text>
  <text x="399" y="530" text-anchor="middle" class="small">1152→512</text>

  <line x1="458" y1="515" x2="492" y2="515" class="arrow"/>
  <rect x="492" y="472" width="78" height="86" rx="4" class="relu"/>
  <text x="531" y="520" text-anchor="middle" class="label">ReLU</text>

  <line x1="570" y1="515" x2="620" y2="515" class="arrow"/>
  <rect x="620" y="462" width="118" height="106" rx="4" class="fc"/>
  <text x="679" y="503" text-anchor="middle" class="label">Linear</text>
  <text x="679" y="530" text-anchor="middle" class="small">512→235</text>

  <line x1="738" y1="515" x2="800" y2="515" class="arrow"/>
  <rect x="800" y="472" width="126" height="86" rx="4" class="input"/>
  <text x="863" y="505" text-anchor="middle" class="label">Raw Logits</text>
  <text x="863" y="530" text-anchor="middle" class="small">[B,235]</text>

  <line x1="926" y1="515" x2="993" y2="515" class="arrow"/>
  <circle cx="1014" cy="515" r="18" fill="#ffffff" stroke="#777" stroke-width="2"/>
  <text x="1014" y="520" text-anchor="middle" class="label">⊙</text>

  <rect x="933" y="626" width="162" height="72" rx="4" class="mask"/>
  <text x="1014" y="655" text-anchor="middle" class="label">Action Mask</text>
  <text x="1014" y="678" text-anchor="middle" class="small">masked_fill(~mask,-1e9)</text>
  <path d="M 1014 626 V 540" class="arrow"/>

  <line x1="1032" y1="515" x2="1110" y2="515" class="arrow"/>
  <rect x="1110" y="472" width="150" height="86" rx="4" class="input"/>
  <text x="1185" y="505" text-anchor="middle" class="label">Masked Logits</text>
  <text x="1185" y="530" text-anchor="middle" class="small">[B,235]</text>

  <line x1="1260" y1="515" x2="1316" y2="515" class="arrow"/>
  <rect x="1316" y="472" width="116" height="86" rx="4" fill="#f7f7f7" stroke="#bdbdbd" stroke-width="2.5"/>
  <text x="1374" y="505" text-anchor="middle" class="label">Action</text>
  <text x="1374" y="530" text-anchor="middle" class="small">235 classes</text>

  <!-- Legend -->
  <rect x="70" y="760" width="1460" height="82" rx="10" fill="#fafafa" stroke="#e6e6e6"/>
  <text x="95" y="794" class="label" style="font-weight:700">Legend</text>
  <rect x="180" y="775" width="42" height="30" rx="3" class="conv"/><text x="232" y="796" class="small">Conv</text>
  <rect x="300" y="775" width="42" height="30" rx="3" class="bn"/><text x="352" y="796" class="small">BatchNorm</text>
  <rect x="465" y="775" width="42" height="30" rx="3" class="relu"/><text x="517" y="796" class="small">ReLU</text>
  <rect x="585" y="775" width="42" height="30" rx="3" class="flat"/><text x="637" y="796" class="small">Flatten</text>
  <rect x="735" y="775" width="42" height="30" rx="3" class="fc"/><text x="787" y="796" class="small">Linear</text>
  <rect x="875" y="775" width="42" height="30" rx="3" class="mask"/><text x="927" y="796" class="small">Mask / operation</text>
  <rect x="1090" y="773" width="72" height="34" rx="6" class="resbox"/><text x="1175" y="796" class="small">Repeated residual block group</text>
  <text x="95" y="826" class="tiny">Notes: spatial size remains 4×9 throughout convolutional layers due to stride=1 and padding=1. The final action mask suppresses illegal actions by assigning -1e9.</text>
</svg>
