t><text x="540" y="229" text-anchor="middle" font-size="15" font-family="Arial">• Block Sampler</text><line x1="630" y1="195" x2="660" y2="195" stroke="#444" stroke-width="3"/><polygon points="660,195 650,189 650,201" fill="#444"/><rect x="660" y="100" width="180" height="190" rx="18" fill="#FCF3CF" stroke="#555" stroke-width="2"/><text x="750" y="135" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Online</text><text x="750" y="157" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Augmentation</text><text x="750" y="189" text-anchor="middle" font-size="15" font-family="Arial">• 12× Symmetry</text><text x="750" y="209" text-anchor="middle" font-size="15" font-family="Arial">• Tile Permutation</text><line x1="840" y1="195" x2="870" y2="195" stroke="#444" stroke-width="3"/><polygon points="870,195 860,189 860,201" fill="#444"/><rect x="870" y="100" width="180" height="190" rx="18" fill="#E8DAEF" stroke="#555" stroke-width="2"/><text x="960" y="135" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">CNN Policy</text><text x="960" y="157" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Network</text><text x="960" y="189" text-anchor="middle" font-size="15" font-family="Arial">• ResNet×16</text><text x="960" y="209" text-anchor="middle" font-size="15" font-family="Arial">• Policy Head</text><line x1="1050" y1="195" x2="1080" y2="195" stroke="#444" stroke-width="3"/><polygon points="1080,195 1070,189 1070,201" fill="#444"/><rect x="1080" y="100" width="180" height="190" rx="18" fill="#FADBD8" stroke="#555" stroke-width="2"/><text x="1170" y="135" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Training</text><text x="1170" y="167" text-anchor="middle" font-size="15" font-family="Arial">• AdamW</text><text x="1170" y="187" text-anchor="middle" font-size="15" font-family="Arial">• Cosine LR</text><text x="1170" y="207" text-anchor="middle" font-