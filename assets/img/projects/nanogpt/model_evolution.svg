<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="280" viewBox="0 0 1400 280" role="img" aria-label="nanoGPT model evolution">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 14; ry: 14; }
      .title { font: 600 18px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .sub { font: 14px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect class="box" x="24" y="78" width="200" height="124" />
  <text class="title" x="124" y="118" text-anchor="middle">Baseline 0</text>
  <text class="sub" x="124" y="146" text-anchor="middle">nanoGPT GPT-2 124M</text>

  <rect class="box" x="252" y="78" width="200" height="124" />
  <text class="title" x="352" y="118" text-anchor="middle">Baseline 1</text>
  <text class="sub" x="352" y="146" text-anchor="middle">Recipe + Muon</text>

  <rect class="box" x="480" y="78" width="200" height="124" />
  <text class="title" x="580" y="118" text-anchor="middle">Baseline 2</text>
  <text class="sub" x="580" y="146" text-anchor="middle">QK-Norm + Learnable Scale</text>
  <text class="sub" x="580" y="168" text-anchor="middle">+ 1-bank VE</text>

  <rect class="box" x="708" y="78" width="200" height="124" />
  <text class="title" x="808" y="118" text-anchor="middle">Baseline 3</text>
  <text class="sub" x="808" y="146" text-anchor="middle">tiny residual init</text>
  <text class="sub" x="808" y="168" text-anchor="middle">ReLU² FFN + gated attention</text>

  <rect class="box" x="936" y="78" width="200" height="124" />
  <text class="title" x="1036" y="118" text-anchor="middle">Baseline 4</text>
  <text class="sub" x="1036" y="146" text-anchor="middle">Dense Speedrun</text>
  <text class="sub" x="1036" y="168" text-anchor="middle">+ readout backout</text>

  <rect class="box" x="1164" y="78" width="212" height="124" style="fill:#eff6ff;stroke:#1d4ed8;" />
  <text class="title" x="1270" y="118" text-anchor="middle" style="fill:#1e3a8a;">Best @ E47</text>
  <text class="sub" x="1270" y="146" text-anchor="middle">WSD linear 30%</text>
  <text class="sub" x="1270" y="168" text-anchor="middle" style="font-weight:600;fill:#1e40af;">full val loss = 3.005883</text>

  <path class="arrow" d="M224 140 L252 140" />
  <path class="arrow" d="M452 140 L480 140" />
  <path class="arrow" d="M680 140 L708 140" />
  <path class="arrow" d="M908 140 L936 140" />
  <path class="arrow" d="M1136 140 L1164 140" />
</svg>
